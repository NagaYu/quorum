name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run the suite
        # The statistical tests are Monte-Carlo but fully seeded, so they are
        # deterministic; `slow` covers the heaviest coverage replication.
        run: python -m pytest -q -m "not slow"
      - name: Quick benchmark smoke
        run: python -m benchmarks.run --quick --only main --reps 2 --out /tmp/results
