[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-eval"
version = "0.1.0"
description = "Rank-targeted nested sequential design for LLM evaluation: same conclusion, orders of magnitude fewer rollouts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Quorum contributors" }]
keywords = ["llm-evaluation", "sequential-testing", "anytime-valid", "experimental-design", "lighteval", "variance-reduction"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
bench = ["pandas>=2.0", "matplotlib>=3.7"]
app = ["gradio>=4.0", "pandas>=2.0"]
hub = ["datasets>=2.14", "huggingface_hub>=0.20"]
dev = ["pytest>=7.4", "pandas>=2.0", "matplotlib>=3.7"]
all = ["pandas>=2.0", "matplotlib>=3.7", "gradio>=4.0", "datasets>=2.14", "huggingface_hub>=0.20", "pytest>=7.4"]

[project.scripts]
quorum = "quorum.cli:main"

[project.urls]
Homepage = "https://github.com/quorum-eval/quorum"

[tool.setuptools.packages.find]
include = ["quorum*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical validation (deselect with '-m \"not slow\"')"]
filterwarnings = ["ignore::DeprecationWarning"]
